# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Creates the web service only: the database
# is your single Neon Postgres (same one you use locally), entered when prompted.
services:
  - type: web
    name: spendwise
    runtime: node
    plan: free
    region: singapore # closest to Neon ap-southeast-1
    # NODE_ENV=production makes `npm ci` skip devDependencies, but the build
    # needs TypeScript, so include them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations (and seeds the demo org when SEED_DEMO=true), then serves.
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Neon pooled connection string (host contains "-pooler"). Prompted once; never committed.
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string (same, without "-pooler"), used for migrations.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Receipts are stored in Postgres, so uploads survive restarts and deploys
      # on the free plan (whose disk is wiped) with no extra storage service.
      - key: RECEIPT_STORAGE
        value: database
      # Optional: APP_URL. If unset, Render's RENDER_EXTERNAL_URL is used, which
      # is right unless you add a custom domain.
      - key: APP_URL
        sync: false
      # Seed the "Acme Travel" demo org on first boot (skipped once it exists).
      - key: SEED_DEMO
        value: 'true'
      # Optional fixed demo connector token (sw_ + 20+ url-safe chars) so the
      # README can show a stable URL. Leave empty for a random one (see logs).
      - key: DEMO_MCP_TOKEN
        sync: false
